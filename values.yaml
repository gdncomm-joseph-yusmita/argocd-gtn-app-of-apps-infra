applications:
  redis:
    enabled: true
    destination:
      namespace: redis
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 27.0.18

  vault:
    enabled: true
    destination:
      namespace: vault
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.28.0

    # Prevent ArgoCD from marking the Vault application as
    # `OutOfSync` due to mutating webhook injecting a TLS certificate
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        name: vault-agent-injector-cfg
        jqPathExpressions:
          - .webhooks[]?.clientConfig.caBundle

  consul:
    enabled: true
    destination:
      namespace: consul
    repoURL: https://helm.releases.hashicorp.com
    chart: consul
    targetRevision: 1.4.1

  mongodb:
    enabled: true
    destination:
      namespace: mongodb
    repoURL: https://charts.bitnami.com/bitnami
    chart: mongodb
    targetRevision: 19.1.22

